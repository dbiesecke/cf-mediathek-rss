openapi: 3.1.1
info:
  title: Mediathek MRSS Aggregator
  version: 1.3.0
  description: Aggregiert Mediathek-RSS in MRSS, filtert Original- und barrierefreie Sonderfassungen und entfernt inhaltsgleiche Dubletten.
servers:
  - url: https://cf-mediathek-mrss.bcgd1.workers.dev
    description: Geplante Adresse. Worker muss zuerst bereitgestellt werden.
tags:
  - name: Feeds
  - name: Service
paths:
  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Gesundheitsstatus und Version
      responses:
        '200':
          description: Status des Worker-Prozesses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  service: {type: string}
                  version: {type: string}
                  providers: {type: integer}
                  variantPolicy: {type: string}
                  deduplication: {type: string}
              example:
                ok: true
                service: mediathek-mrss
                version: 1.3.0
                providers: 12
  /providers:
    get:
      tags: [Service]
      operationId: listProviders
      summary: Verfügbare Senderquellen
      responses:
        '200':
          description: Provider mit Namen und Suchfiltern.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    label: {type: string}
                    query: {type: string}
              example:
                arte: {label: ARTE, query: '!ARTE >30'}
                '3sat': {label: 3sat, query: '!3sat >30'}
  /:
    get:
      operationId: searchPage
      tags: [Service]
      summary: HTML-Suchoberfläche
      responses:
        '200':
          description: Suchformular im Browser.
          content:
            text/html:
              schema: {type: string}
  /search:
    get:
      operationId: searchFeeds
      tags: [Feeds]
      summary: Suche mit JSON- oder HTML-Ausgabe
      description: Durchsucht die aktuell gelieferten Feed-Einträge, nicht das vollständige Mediathekarchiv.
      parameters:
        - $ref: '#/components/parameters/Providers'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Naming'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/LanguageSource'
        - $ref: '#/components/parameters/PlayableOnly'
        - $ref: '#/components/parameters/MinDuration'
        - $ref: '#/components/parameters/MaxDuration'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: format
          in: query
          description: Antwort als JSON oder HTML.
          schema: {type: string, enum: [json, html], default: json}
      responses:
        '200':
          description: Gefilterte Treffer mit Gesamtzahl und Diagnose.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMatched: {type: integer}
                  returned: {type: integer}
                  filteredVariants: {type: integer}
                  removedDuplicates: {type: integer}
                  failedSources: {type: array, items: {type: string}}
                  items: {type: array, items: {type: object}}
              example:
                totalMatched: 1
                returned: 1
                filteredVariants: 2
                removedDuplicates: 1
                failedSources: []
                items:
                  - title: Die Wälder der Zukunft
                    provider: ARTE
                    language: de
                    languageSource: assumed
                    audioVerified: false
                    durationSeconds: 2700
            text/html:
              schema: {type: string}
        '400': {description: Ungültige Filterparameter.}
        '502': {description: Alle Feeds fehlgeschlagen.}
  /mrss:
    get:
      tags: [Feeds]
      operationId: getAggregatedMrss
      summary: MRSS aus mehreren Providern
      description: Entfernt OV/OmU, AD, SDH/UT und DGS, dedupliziert nach Titel, Episode und URL. Ohne belegte Episode wird kein SxxExx erfunden.
      parameters:
        - $ref: '#/components/parameters/Providers'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Naming'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/LanguageSource'
        - $ref: '#/components/parameters/PlayableOnly'
        - $ref: '#/components/parameters/MinDuration'
        - $ref: '#/components/parameters/MaxDuration'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/Mrss'
        '400':
          description: Ungültige Parameter.
        '502':
          description: Kein Quellfeed erreichbar.
  /mrss/{provider}:
    get:
      tags: [Feeds]
      operationId: getProviderMrss
      summary: MRSS eines einzelnen Providers
      parameters:
        - name: provider
          in: path
          required: true
          description: Schlüssel aus GET /providers.
          schema:
            type: string
            example: arte
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Naming'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/LanguageSource'
        - $ref: '#/components/parameters/PlayableOnly'
        - $ref: '#/components/parameters/MinDuration'
        - $ref: '#/components/parameters/MaxDuration'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/Mrss'
        '400':
          description: Unbekannter Provider oder ungültiger Parameter.
        '502':
          description: Quellfeed nicht erreichbar.
components:
  parameters:
    Query:
      name: q
      in: query
      description: Alle Wörter müssen in Titel, Beschreibung, Serie, Kategorie oder Provider vorkommen.
      schema: {type: string, maxLength: 200}
      example: Geschichte
    Category:
      name: category
      in: query
      description: Teilstring-Suche in der Kategorie.
      schema: {type: string, maxLength: 100}
      example: Wissenschaft
    Language:
      name: language
      in: query
      description: ISO-Sprachmetadatum, nicht technisch geprüfte Audiosprache.
      schema: {type: string, example: de}
    LanguageSource:
      name: languageSource
      in: query
      description: Quelle des Sprachmetadatums.
      schema: {type: string, enum: [source, assumed]}
    PlayableOnly:
      name: playableOnly
      in: query
      description: Nur Beiträge mit direkter Video-URL.
      schema: {type: boolean, default: false}
    MinDuration:
      name: minDuration
      in: query
      description: Mindestlaufzeit in Sekunden; unbekannte Dauer ausgeschlossen.
      schema: {type: integer, minimum: 0, maximum: 864000}
      example: 1200
    MaxDuration:
      name: maxDuration
      in: query
      description: Maximallaufzeit in Sekunden; unbekannte Dauer ausgeschlossen.
      schema: {type: integer, minimum: 0, maximum: 864000}
      example: 7200
    From:
      name: from
      in: query
      description: Ab Veröffentlichungsdatum einschließlich.
      schema: {type: string, format: date}
      example: '2026-10-01'
    To:
      name: to
      in: query
      description: Bis Veröffentlichungsdatum einschließlich.
      schema: {type: string, format: date}
      example: '2026-10-25'
    Sort:
      name: sort
      in: query
      description: Sortierung nach Datum, Titel oder Dauer.
      schema: {type: string, enum: [date, title, duration], default: date}
    Order:
      name: order
      in: query
      description: Sortierreihenfolge.
      schema: {type: string, enum: [asc, desc], default: desc}
    Providers:
      name: providers
      in: query
      description: Kommagetrennte Auswahl. Ohne Angabe alle 12 Provider.
      schema:
        type: string
        example: arte,3sat,ndr
    Limit:
      name: limit
      in: query
      description: Maximale Zahl ausgegebener eindeutiger Einträge.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 250
        example: 100
    Naming:
      name: naming
      in: query
      description: emby setzt formatierte Titel, original erhält Quelltitel. emby:filename wird immer ausgegeben.
      schema:
        type: string
        enum: [emby, original]
        default: emby
        example: emby
  responses:
    Mrss:
      description: Bereinigter RSS-2.0-Feed mit MRSS-, Dublin-Core- und Emby-Metadaten. STRM-Pfade sind Vorschläge.
      headers:
        x-feed-items:
          description: Zahl der Einträge im MRSS.
          schema: {type: integer}
        x-total-matched:
          description: Gefilterte Treffer vor Limit.
          schema: {type: integer}
        x-filtered-variants:
          description: Wegen Sonderfassungs-Markierungen verworfene Beiträge.
          schema: {type: integer}
        x-removed-duplicates:
          description: Nach Normalisierung zusammengeführte Duplikate.
          schema: {type: integer}
        x-failed-sources:
          description: Kommagetrennte IDs fehlgeschlagener Quellen.
          schema: {type: string}
      content:
        application/rss+xml:
          schema:
            type: string
          example: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <rss version="2.0" xmlns:media="http://search.yahoo.com/mrss/" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:emby="urn:cf-mediathek-mrss:emby:1">
              <channel><title>Mediathek MRSS – ARTE</title><item>
              <title>Beispielserie - S02E03 - Die Suche</title>
              <dc:language>de</dc:language><emby:languageSource>assumed</emby:languageSource>
              <emby:audioVerified>false</emby:audioVerified>
              <emby:series>Beispielserie</emby:series><emby:season>2</emby:season><emby:episode>3</emby:episode>
              <emby:filename>Beispielserie - S02E03 - Die Suche.strm</emby:filename>
              <emby:relativePath>Beispielserie/Season 02/Beispielserie - S02E03 - Die Suche.strm</emby:relativePath>
              </item></channel>
            </rss>